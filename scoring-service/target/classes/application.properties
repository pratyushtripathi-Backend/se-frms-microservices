spring.application.name=scoring-service
server.port=8094

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.scoring=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

spring.datasource.url=jdbc:postgresql://localhost:5432/se_frms_scoring_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
# Database changes are handled by the explicit SQL migration. Hibernate must not
# try to add a NOT NULL JSONB column before existing rows are backfilled.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# @Async thread pool (AsyncConfig). Was Spring's default of 8 threads.
frms.async.core-size=16
frms.async.max-size=32
# Large queue so a burst never makes the HTTP request thread run the @Async work
# itself (CallerRunsPolicy stays only as a last resort).
frms.async.queue-capacity=10000

# DB connection pool. Keep the total of all services under Postgres max_connections.
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# ---- Scoring rows: batched saves (ScoringPersistenceService) ---------------
# Background writers save everything waiting (up to 50) in one transaction with
# batched INSERTs. Nothing waits for a batch to fill.
frms.scoring.persist.batch-size=50
frms.scoring.persist.writer-threads=2
frms.scoring.persist.queue-capacity=20000
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# ---- AI shadow risk-score (evaluation only, never blends into the live decision) --------------
# Off by default: this calls an external LLM per transaction (real cost, real rate limit),
# unlike everything else in this service. AiScoringAsyncService.scoreAsync() is fired after the
# rule-based response is already built, on its own bounded pool (aiScoringExecutor below) - it
# can never slow or fail the sub-200ms scoring response, at any transaction volume.
frms.ai.risk-score.enabled=true
frms.ai.base-url=http://localhost:8101
frms.ai.path=/api/v1/ai
frms.ai.http.connect-timeout-ms=3000
frms.ai.http.read-timeout-ms=25000

# Deliberately small and separate from frms.async.* (AsyncConfig/taskExecutor) above, whose
# CallerRunsPolicy must never apply to a Claude call. If this pool and its queue are ever full
# (e.g. a 1000+ transaction burst outpacing Claude's own throughput), the AI-score attempt for
# that transaction is dropped and logged, never queued without bound or run on the caller thread.
frms.ai.async.core-size=5
frms.ai.async.max-size=10
frms.ai.async.queue-capacity=500
