spring.application.name=scoring-service
server.port=8094

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.scoring=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

spring.datasource.url=jdbc:postgresql://localhost:5432/se_frms_scoring_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
# Database changes are handled by the explicit SQL migration. Hibernate must not
# try to add a NOT NULL JSONB column before existing rows are backfilled.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# @Async thread pool (AsyncConfig). Was Spring's default of 8 threads.
frms.async.core-size=16
frms.async.max-size=32
frms.async.queue-capacity=1000

# DB connection pool. Keep the total of all services under Postgres max_connections.
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
