spring.application.name=auth-service
server.port=8100

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.auth=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Must match api-gateway's frms.security.jwt.secret exactly.
frms.security.jwt.secret=${JWT_SECRET:frms-enterprise-gateway-shared-secret-change-me-32-bytes-min}
frms.security.jwt.expiration-minutes=60
