spring.application.name=decision-service
server.port=8095

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.decision=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

spring.datasource.url=jdbc:postgresql://localhost:5432/se_frms_decision_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
decision.threshold.allow-max=39
decision.threshold.review-max=69
decision.policy.refresh-interval-ms=30000
frms.rule-cache.base-url=http://localhost:8093
frms.rule-cache.active-decision-policy-path=/api/v1/rules/decision-policy/active

# Used by the case-management list (GET /api/v1/decisions/cases) to enrich
# each decision with matched-rule detail and amount/mode.
frms.scoring.base-url=http://localhost:8094
frms.scoring.path=/api/v1/scoring
frms.transaction.base-url=http://localhost:8099
frms.transaction.path=/api/v1/transactions
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

