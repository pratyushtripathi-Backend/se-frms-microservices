spring.application.name=notification-service
server.port=8096

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.notification=INFO

spring.datasource.url=jdbc:postgresql://localhost:5432/se_frms_notification_db
spring.datasource.username=postgres
spring.datasource.password=Archita123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.se.frms.notification.dto.FraudEvent
frms.kafka.topic.fraud-events=frms.fraud-events

# SMTP credentials and alert recipients are supplied outside source control.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=archita.gupta@secureedge.in
spring.mail.password=oybefzqntbnpdaib
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Comma-separated configured fraud-admin email addresses. EMAIL is disabled until configured.
notification.email.enabled=true

# Fraud-admin recipients are refreshed from the Monolith and read from Redis during event processing.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000
notification.monolith.base-url=${MONOLITH_BASE_URL:http://localhost:8080}
notification.monolith.internal-api-key=${INTERNAL_API_KEY:local-internal-key}
notification.recipients.redis-key=frms:notification:admin-recipients
notification.recipients.ttl-minutes=10
notification.recipients.sync.initial-delay-ms=1000
notification.recipients.sync.fixed-delay-ms=300000

# Active email templates are read from Notification DB and refreshed into Redis.
notification.templates.redis-key-prefix=frms:notification:template:
notification.templates.ttl-minutes=60
notification.templates.sync.initial-delay-ms=2000
notification.templates.sync.fixed-delay-ms=300000

# SMS stays disabled until the REVIEW and BLOCK DLT templates are approved and mapped in MSG24x7.
notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:false}
notification.sms.msg24x7.send-url=${MSG24X7_SEND_URL:https://control.msg24x7.com/api/v2/SendSMS}
notification.sms.msg24x7.api-key=${MSG24X7_API_KEY:}
notification.sms.msg24x7.client-id=${MSG24X7_CLIENT_ID:}
notification.sms.msg24x7.sender-id=${MSG24X7_SENDER_ID:SCEDGE}
notification.sms.msg24x7.principle-entity-id=${MSG24X7_PRINCIPAL_ENTITY_ID:}
notification.sms.msg24x7.review-template-id=${FRAUD_REVIEW_SMS_TEMPLATE_ID:}
notification.sms.msg24x7.block-template-id=${FRAUD_BLOCK_SMS_TEMPLATE_ID:}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

