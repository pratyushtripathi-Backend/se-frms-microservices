spring.application.name=transaction-service
server.port=8099

# Bounded ingress capacity for a 1,000-request burst. Requests can wait for a
# worker; concurrency is not a promise of 1,000 simultaneous fraud evaluations.
server.tomcat.threads.max=${TRANSACTION_HTTP_THREADS:256}
server.tomcat.threads.min-spare=${TRANSACTION_HTTP_MIN_SPARE:32}
server.tomcat.accept-count=${TRANSACTION_HTTP_ACCEPT_COUNT:1000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.file.name=logs/transaction-service.log
logging.level.com.se.frms.transaction=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

spring.datasource.url=jdbc:postgresql://localhost:5432/se_frms_transaction_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
frms.fraud-engine.base-url=http://fraud-engine-service
frms.fraud-engine.evaluation-path=/api/v1/fraud-evaluations
# Up to this many saved transactions per call to fraud-engine (POST .../batch) instead
# of one call each. false = one call per transaction, as before (also used for a minute
# automatically if fraud-engine has no batch endpoint).
frms.fraud-engine.batch.enabled=true
frms.fraud-engine.batch.size=20

# @Async thread pool (AsyncConfig). Was Spring's default of 8 threads.
frms.async.core-size=32
frms.async.max-size=64
# Also runs the POST's response step once Kafka has confirmed the write.
frms.async.queue-capacity=10000

# Shared pooled HTTP client for service-to-service calls (HttpClientConfig).
frms.http.max-connections=200
frms.http.max-connections-per-route=200
frms.http.connect-timeout-ms=2000
frms.http.read-timeout-ms=10000
# Wait up to 10 s for a free pooled connection in a burst instead of failing after 2 s.
frms.http.pool-wait-timeout-ms=10000

# ---- Transaction queue (Kafka) --------------------------------------------
# The POST publishes each accepted transaction to this topic; this service's own
# TransactionIngestConsumer saves them in batches and runs the fraud evaluation.
# Use the same Kafka as the other services (on UAT: localhost:8100).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
frms.kafka.topic.transactions=frms.transactions
frms.kafka.topic.transactions.partitions=12
# Consumer threads (keep <= partitions) and transactions per batch.
frms.kafka.transactions.concurrency=12
frms.kafka.transactions.max-poll-records=100
# Parallel fraud-engine calls for the batches being processed.
frms.evaluation.threads=128
# Optional, Java 21+ only: run evaluations on virtual threads instead of the pool above.
# Off: in local tests more parallel calls only queued up inside fraud-engine. Try it on
# UAT together with a higher max-in-flight and compare.
frms.evaluation.virtual-threads=false
# Max fraud evaluations running at once (same as the thread count, as before); the
# consumer waits for a free slot beyond this.
frms.evaluation.max-in-flight=128
# Fraud results are written with batched UPDATEs of up to this many rows.
frms.evaluation.result-batch-size=200
# Up to 5 ms of batching for the POST's Kafka writes (was 0).
frms.kafka.producer.linger-ms=5
# Transactions the database refuses to save (bad data) are parked here.
frms.kafka.topic.transactions.dlt=frms.transactions.DLT

# ---- Stuck transaction recovery (StuckTransactionRecoveryJob) -----------------
# Every minute, re-evaluate transactions still FRAUD_EVALUATION_IN_PROGRESS 5 min after
# their evaluation started (max 100 per run; older than 24 h are left untouched).
frms.recovery.interval-ms=60000
frms.recovery.stuck-after-minutes=5
frms.recovery.max-age-hours=24
frms.recovery.batch-size=100

# ---- Duplicate check (Redis) ---------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
# How long an externalTransactionId is remembered in Redis. Older retries are
# still caught when the transaction is saved.
frms.duplicate-check.ttl-days=30

# ---- Batch inserts ---------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Rewrite compatible JDBC INSERT batches into multi-row PostgreSQL statements.
# Keep the existing transaction boundaries, batch size, and connection budget.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
