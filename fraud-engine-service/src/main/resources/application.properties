spring.application.name=fraud-engine-service
server.port=8092

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.fraudengine=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=5000
frms.kafka.topic.fraud-events=frms.fraud-events
# Partition count applied on startup (KafkaTopicConfig). Same as notification-service's
# 12 consumers, so none of them sits idle. Kafka only ever adds partitions.
frms.kafka.topic.fraud-events.partitions=12
# Producer: send immediately (no batching delay) - this topic carries real-time alerts.
spring.kafka.producer.properties.linger.ms=0
# Keep the producer ready between bursts (speed only - same events, same topic).
# By default the client forgets a topic's partition details after 5 idle minutes
# (metadata.max.idle.ms) and closes its idle broker connection after 9 minutes
# (connections.max.idle.ms); the first send after that waited 100-270 ms to look
# them up again. Keep both for a long time instead. Metadata is still refreshed
# every metadata.max.age.ms (default 5 min), so new partitions are still picked up.
spring.kafka.producer.properties.metadata.max.idle.ms=86400000
spring.kafka.producer.properties.connections.max.idle.ms=3600000
frms.rule-cache.base-url=http://localhost:8093
frms.rule-cache.active-rules-path=/api/v1/rules/active
frms.rule-cache.active-blacklist-path=/api/v1/rules/blacklist/active
frms.rule-cache.refresh-interval-ms=5000
frms.blacklist.virtual-rule.score=100
geoapify.geocoding.base-url=https://api.geoapify.com/v1/geocode/reverse
geoapify.geocoding.api-key=164c915596e449d197ef377dcebf4fe0
frms.scoring.base-url=http://localhost:8094
frms.scoring.path=/api/v1/scoring
frms.decision.base-url=http://localhost:8095
frms.decision.path=/api/v1/decisions
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

logging.file.name=logs/fraud-engine-service.log

# @Async thread pool (AsyncConfig). Was Spring's default of 8 threads.
frms.async.core-size=16
frms.async.max-size=32
# Large queue so a burst never makes the HTTP request thread run the @Async work
# itself (CallerRunsPolicy stays only as a last resort).
frms.async.queue-capacity=10000

# Shared pooled HTTP client for service-to-service calls (HttpClientConfig).
# Match 128 evaluation workers plus up to 12 Kafka consumer caller-runs tasks.
# Leave headroom for cache refreshes and shared-client traffic without increasing
# database pools or adding more evaluation workers.
frms.http.max-connections=${FRAUD_HTTP_MAX_CONNECTIONS:256}
frms.http.max-connections-per-route=${FRAUD_HTTP_MAX_CONNECTIONS_PER_ROUTE:160}
frms.http.connect-timeout-ms=2000
frms.http.read-timeout-ms=5000
# Wait up to 4 s (was 2 s) for a free connection to scoring/decision in a burst
# instead of failing the evaluation. Kept well under transaction-service's 10 s
# read timeout for the whole fraud-engine call.
frms.http.pool-wait-timeout-ms=4000

# ---- Shared geocode cache (Redis) ----------------------------------------
# GeocodeCache checks its in-memory cache first, then Redis, then Geoapify.
# Same Redis as transaction-service. Short timeouts: if Redis is down or slow,
# GeocodeRedisStore skips it for 30 s and evaluation works exactly as before.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
# Redis is optional here, so it must not turn /actuator/health DOWN.
management.health.redis.enabled=false
frms.geocode.redis.key-prefix=frms:geocode:
frms.geocode.redis.ttl-days=30

# ---- Batch evaluation (POST /api/v1/fraud-evaluations/batch) -----------------
# One call to Scoring / Decision Service per batch instead of one per transaction.
# false = one call per transaction (as before), also used automatically for a minute
# if Scoring / Decision Service has no batch endpoint.
frms.scoring.batch.enabled=true
frms.decision.batch.enabled=true
# Threads that prepare a batch's transactions in parallel (location lookup etc.).
frms.fraud-evaluation.batch.threads=64

# ---- Location cache preload (POST /api/v1/geocode/preload) -------------------
# Max Geoapify lookups per second while preloading (free plan: 3,000 per day).
frms.geocode.preload.per-second=5
