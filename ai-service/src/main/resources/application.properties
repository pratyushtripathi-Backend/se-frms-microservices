spring.application.name=ai-service
server.port=8101

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

spring.datasource.url=jdbc:postgresql://localhost:5432/se_frms_ai_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# DB connection pool. Keep the total of all services under Postgres max_connections.
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# Claude API. Key is never hardcoded here - export ANTHROPIC_API_KEY before starting this service.
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=claude-sonnet-5-5
ai.anthropic.max-tokens=1024

# Shared pooled HTTP client for the Claude API call (HttpClientConfig). Read timeout is longer
# than the internal-lookup services use (frms.http.read-timeout-ms=5000 elsewhere) - an LLM
# completion has a materially longer tail latency than a CRUD/Postgres read.
frms.http.max-connections=50
frms.http.max-connections-per-route=50
frms.http.connect-timeout-ms=3000
frms.http.read-timeout-ms=20000
frms.http.pool-wait-timeout-ms=3000
