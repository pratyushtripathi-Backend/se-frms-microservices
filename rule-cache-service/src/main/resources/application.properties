spring.application.name=rule-cache-service
server.port=8093

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.rulecache=INFO

spring.datasource.url=jdbc:postgresql://localhost:5432/se_frms_rule_cache_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000

frms.monolith.base-url=http://localhost:8080
frms.monolith.internal-api-key=local-internal-key

rule-cache.redis.active-rules-key=frms:rule-cache:active-rules
rule-cache.redis.ttl-minutes=10

rule-cache.sync.initial-delay-ms=30000
rule-cache.sync.fixed-delay-ms=300000

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}