spring.application.name=analytics-service
server.port=8097

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.se.frms.analytics=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

spring.datasource.url=jdbc:postgresql://localhost:5432/se_frms_analytics_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.se.frms.analytics.dto.FraudEvent
frms.kafka.topic.fraud-events=frms.fraud-events
# Consumed via a dedicated listener/consumer-factory (DecisionReviewedKafkaConfig)
# rather than the default one above, since that default factory is pinned to
# FraudEvent via spring.json.value.default.type.
frms.kafka.topic.decision-reviewed=frms.decision-reviewed

# AI-generated plain-English summary of the fraud-trend/rule-performance
# numbers (AiTrendSummaryClient, GET .../ai-summary). Off switch:
# frms.ai.trend-summary.enabled=false stops calling ai-service without any
# code change.
frms.ai.base-url=http://localhost:8101
frms.ai.path=/api/v1/ai
frms.ai.trend-summary.enabled=true
# An LLM completion is materially slower than this service's own (currently
# nonexistent) internal lookups, hence the longer read timeout.
frms.ai.http.connect-timeout-ms=3000
frms.ai.http.read-timeout-ms=25000

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

